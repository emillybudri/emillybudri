<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 248" width="1000" height="248" role="img" aria-label="Lei de UX do dia 27.11.2026: LEI DA CONTINUIDADE. Elementos alinhados em uma curva ou reta são lidos como um caminho só. É o que faz uma trilha de passos parecer um processo, e não itens soltos."><defs><clipPath id="budri-componente"><rect width="1000" height="248"/></clipPath><style>
      .marca-move{animation:marca-move 15s ease-in-out infinite}
      .marca-pulse{animation:marca-pulse 4s ease-in-out infinite}
      @keyframes marca-move{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-8px)}}
      @keyframes marca-pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style></defs><g clip-path="url(#budri-componente)"><path d="M16 1H960L999 40V247H16Q1 247 1 232V16Q1 1 16 1Z" fill="#0c0911" stroke="#39264d"/><path d="M960 1V40H999" fill="#39264d"/><path d="M18 20V228" stroke="#a855f7" stroke-width="4"/><g transform="translate(0 0)">
  <defs>
    <linearGradient id="lFundo" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#131017"/><stop offset="55%" stop-color="#0c0911"/><stop offset="100%" stop-color="#171020"/>
    </linearGradient>
    <radialGradient id="lB1" cx="50%" cy="50%"><stop offset="0%" stop-color="#b06cf0" stop-opacity=".16"/><stop offset="100%" stop-color="#b06cf0" stop-opacity="0"/></radialGradient>
    <linearGradient id="lRegua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <clipPath id="lCard"><rect width="1000" height="248" rx="28"/></clipPath>
    <clipPath id="lQuadro"><rect x="600" y="32" width="360" height="166" rx="20"/></clipPath>
    <style>
      .sobe{animation:sobe .9s cubic-bezier(.2,.7,.3,1) both}
      .s2{animation-delay:.1s}.s3{animation-delay:.2s}.s4{animation-delay:.3s}
      @keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .vivo{animation:vivo 2.4s ease-in-out infinite}
      @keyframes vivo{0%,100%{opacity:1}50%{opacity:.25}}
      .pulso{animation:pulso 3s ease-in-out infinite}
      @keyframes pulso{0%{opacity:.7}70%,100%{opacity:0}}
      .seta{animation:seta 4s ease-in-out infinite}
      @keyframes seta{0%,100%{transform:translate(0,0)}45%,55%{transform:translate(74px,-64px)}}
      .barra{transform-origin:24px 0;animation:cresce 1.2s cubic-bezier(.2,.7,.3,1) .4s both}
      .b2{transform-origin:214px 0;animation-delay:.55s}
      .enche{transform-origin:28px 0;animation:cresce 1.4s cubic-bezier(.2,.7,.3,1) .4s both}
      @keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .curva{stroke-dasharray:420;stroke-dashoffset:420;animation:curva 2s ease-out .4s forwards}
      @keyframes curva{to{stroke-dashoffset:0}}
      .cur{animation:cur 1s steps(1) infinite}
      @keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
      .bate{animation:bate 2.6s ease-in-out infinite}
      @keyframes bate{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}45%{transform:scale(1)}60%{transform:scale(1.06)}}
      .destaca{animation:destaca 3.4s ease-in-out infinite}
      @keyframes destaca{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @media (prefers-reduced-motion: reduce){
        *{animation:none !important}
        .curva{stroke-dashoffset:0} .pulso{opacity:.4}
      }
    </style>
  </defs>

  <g clip-path="url(#lCard)">



    <g font-family="Segoe UI, Arial, sans-serif">
      <g class="sobe">
        <circle class="vivo" cx="45" cy="44" r="4.5" fill="#4ade80"/>
        <text x="59" y="48" font-size="10.5" letter-spacing="3" fill="#c084fc">LEI DE UX DO DIA &#183; 27.11.2026</text>
      </g>
      <text class="sobe s2" x="38" y="104" font-size="30" font-weight="700" letter-spacing="1.2" fill="#faf8ff">LEI DA CONTINUIDADE</text>
      <rect class="sobe s3" x="40" y="118" width="80" height="4" rx="2" fill="url(#lRegua)"/>
      <g class="sobe s3"><text x="40" y="146" font-size="12.5" fill="#c4bdcf">Elementos alinhados em uma curva ou reta são lidos como</text><text x="40" y="167" font-size="12.5" fill="#c4bdcf">um caminho só. É o que faz uma trilha de passos parecer</text><text x="40" y="188" font-size="12.5" fill="#c4bdcf">um processo, e não itens soltos.</text></g>
      <text class="sobe s4" x="40" y="216" font-size="9" letter-spacing="1.4" fill="#aaa0b7" font-family="SFMono-Regular, Consolas, Menlo, monospace">ATUALIZADA AUTOMATICAMENTE TODA MADRUGADA &#183; UMA LEI DIFERENTE POR DIA</text>

      <g class="sobe s4">
        <rect x="600" y="32" width="360" height="166" rx="20" fill="#131017" stroke="#39264d" stroke-width="1.6"/>
        <g clip-path="url(#lQuadro)"><g transform="translate(600,32)">
  <path class="curva" d="M30 110 C90 110, 110 50, 180 50 C250 50, 270 110, 330 110"
        fill="none" stroke="#c084fc" stroke-width="2.4" opacity=".35"/>
  <circle cx="34" cy="110" r="7" fill="#c084fc"/><circle cx="61" cy="91" r="7" fill="#c084fc"/><circle cx="88" cy="75" r="7" fill="#c084fc"/><circle cx="115" cy="63" r="7" fill="#c084fc"/><circle cx="142" cy="55" r="7" fill="#c084fc"/><circle cx="169" cy="51" r="7" fill="#c084fc"/><circle cx="196" cy="51" r="7" fill="#c084fc"/><circle cx="223" cy="55" r="7" fill="#c084fc"/><circle cx="250" cy="63" r="7" fill="#c084fc"/><circle cx="277" cy="75" r="7" fill="#c084fc"/><circle cx="304" cy="91" r="7" fill="#c084fc"/><circle cx="331" cy="110" r="7" fill="#c084fc"/>
  <text x="180" y="148" font-size="9" letter-spacing="1.4" text-anchor="middle" fill="#c4bdcf">PONTOS EM LINHA VIRAM UM CAMINHO SÓ</text>
</g></g>
      </g>
    </g>


  </g>
</g></g></svg>
