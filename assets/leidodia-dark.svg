<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 248" width="1000" height="248" role="img" aria-label="Lei de UX do dia 21.10.2026: EFEITO GOAL-GRADIENT. Quanto mais perto da linha de chegada, mais forte o empurrão. Por isso o cartão de fidelidade já vem com dois selos preenchidos de brinde.">
  <defs>
    <linearGradient id="lFundo" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#251749"/><stop offset="55%" stop-color="#150b28"/><stop offset="100%" stop-color="#1e1039"/>
    </linearGradient>
    <radialGradient id="lB1" cx="50%" cy="50%"><stop offset="0%" stop-color="#b06cf0" stop-opacity=".16"/><stop offset="100%" stop-color="#b06cf0" stop-opacity="0"/></radialGradient>
    <linearGradient id="lRegua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <clipPath id="lCard"><rect width="1000" height="248" rx="28"/></clipPath>
    <clipPath id="lQuadro"><rect x="600" y="32" width="360" height="166" rx="20"/></clipPath>
    <style>
      .sobe{animation:sobe .9s cubic-bezier(.2,.7,.3,1) both}
      .s2{animation-delay:.1s}.s3{animation-delay:.2s}.s4{animation-delay:.3s}
      @keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .vivo{animation:vivo 2.4s ease-in-out infinite}
      @keyframes vivo{0%,100%{opacity:1}50%{opacity:.25}}
      .pulso{animation:pulso 3s ease-in-out infinite}
      @keyframes pulso{0%{opacity:.7}70%,100%{opacity:0}}
      .seta{animation:seta 4s ease-in-out infinite}
      @keyframes seta{0%,100%{transform:translate(0,0)}45%,55%{transform:translate(74px,-64px)}}
      .barra{transform-origin:24px 0;animation:cresce 1.2s cubic-bezier(.2,.7,.3,1) .4s both}
      .b2{transform-origin:214px 0;animation-delay:.55s}
      .enche{transform-origin:28px 0;animation:cresce 1.4s cubic-bezier(.2,.7,.3,1) .4s both}
      @keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .curva{stroke-dasharray:420;stroke-dashoffset:420;animation:curva 2s ease-out .4s forwards}
      @keyframes curva{to{stroke-dashoffset:0}}
      .cur{animation:cur 1s steps(1) infinite}
      @keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
      .bate{animation:bate 2.6s ease-in-out infinite}
      @keyframes bate{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}45%{transform:scale(1)}60%{transform:scale(1.06)}}
      .destaca{animation:destaca 3.4s ease-in-out infinite}
      @keyframes destaca{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @media (prefers-reduced-motion: reduce){
        *{animation:none !important}
        .curva{stroke-dashoffset:0} .pulso{opacity:.4}
      }
    </style>
  </defs>

  <g clip-path="url(#lCard)">
    <rect width="1000" height="248" fill="url(#lFundo)"/>
    <ellipse cx="60" cy="230" rx="300" ry="160" fill="url(#lB1)"/>

    <g font-family="Jost, Century Gothic, Futura, Segoe UI, Arial, sans-serif">
      <g class="sobe">
        <circle class="vivo" cx="45" cy="44" r="4.5" fill="#4ade80"/>
        <text x="59" y="48" font-size="10.5" letter-spacing="3" fill="#c084fc">LEI DE UX DO DIA &#183; 21.10.2026</text>
      </g>
      <text class="sobe s2" x="38" y="104" font-size="30" font-weight="700" letter-spacing="1.2" fill="#f7f5ff">EFEITO GOAL-GRADIENT</text>
      <rect class="sobe s3" x="40" y="118" width="80" height="4" rx="2" fill="url(#lRegua)"/>
      <g class="sobe s3"><text x="40" y="146" font-size="12.5" fill="#b8b0d6">Quanto mais perto da linha de chegada, mais forte o</text><text x="40" y="167" font-size="12.5" fill="#b8b0d6">empurrão. Por isso o cartão de fidelidade já vem com</text><text x="40" y="188" font-size="12.5" fill="#b8b0d6">dois selos preenchidos de brinde.</text></g>
      <text class="sobe s4" x="40" y="216" font-size="9" letter-spacing="1.4" fill="#8d85ac" font-family="SFMono-Regular, Consolas, Menlo, monospace">ATUALIZADA AUTOMATICAMENTE TODA MADRUGADA &#183; UMA LEI DIFERENTE POR DIA</text>

      <g class="sobe s4">
        <rect x="600" y="32" width="360" height="166" rx="20" fill="#251749" stroke="#3b2366" stroke-width="1.6"/>
        <g clip-path="url(#lQuadro)"><g transform="translate(600,32)">
  <circle cx="54" cy="70" r="14" fill="#c084fc" fill-opacity="0.14" stroke="#c084fc" stroke-width="1.8"/><circle cx="106" cy="70" r="14" fill="#c084fc" fill-opacity="0.31000000000000005" stroke="#c084fc" stroke-width="1.8"/><circle cx="158" cy="70" r="14" fill="#c084fc" fill-opacity="0.48000000000000004" stroke="#c084fc" stroke-width="1.8"/><circle cx="210" cy="70" r="14" fill="#c084fc" fill-opacity="0.65" stroke="#c084fc" stroke-width="1.8"/><circle cx="262" cy="70" r="14" fill="#c084fc" fill-opacity="0.8200000000000001" stroke="#c084fc" stroke-width="1.8"/><circle cx="314" cy="70" r="14" fill="#c084fc" fill-opacity="0.9900000000000001" stroke="#c084fc" stroke-width="1.8"/>
  <path d="M68 70 H92 M120 70 H144 M172 70 H196 M224 70 H248 M276 70 H300" stroke="#c084fc" stroke-width="1.4" opacity=".4"/>
  <circle cx="314" cy="70" r="11" fill="#c084fc" fill-opacity=".18"/><path d="M308.6 70 l4.4 4.6 8 -9" fill="none" stroke="#c084fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="120" font-size="9" letter-spacing="1.4" text-anchor="middle" fill="#b8b0d6">QUANTO MAIS PERTO DO FIM, MAIS RÁPIDO O PASSO</text>
  <text x="180" y="142" font-size="9" letter-spacing="1.4" text-anchor="middle" fill="#b8b0d6">POR ISSO O CARTÃO JÁ COMEÇA COM UM SELO</text>
</g></g>
      </g>
    </g>

    <rect x="1" y="1" width="998" height="246" rx="28" fill="none" stroke="#a855f7" stroke-opacity=".2" stroke-width="2"/>
  </g>
</svg>
