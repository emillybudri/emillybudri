<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 292" width="1000" height="292" role="img" aria-label="Construindo juntos: UX humanizado, performance que vende e arquitetura que escala">
  <defs>
    <filter id="pSombra" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#7e22ce" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="pRegua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0"/><stop offset="100%" stop-color="#9333ea" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="pRegua2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".45"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <style>
      .card{animation:sobe 1s cubic-bezier(.2,.7,.3,1) both}
      .k2{animation-delay:.12s}.k3{animation-delay:.24s}.k4{animation-delay:.36s}
      @keyframes sobe{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
      .bate{animation:bate 2.8s ease-in-out infinite}
      @keyframes bate{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}45%{transform:scale(1)}60%{transform:scale(1.06)}}
      .sobebar{transform-origin:center bottom;animation:sobebar 1.1s cubic-bezier(.2,.7,.3,1) both}
      .v2{animation-delay:.12s}.v3{animation-delay:.24s}
      @keyframes sobebar{from{transform:scaleY(0)}to{transform:scaleY(1)}}
      .empilha{animation:empilha 4.5s ease-in-out infinite}
      .e2{animation-delay:.2s}.e3{animation-delay:.4s}
      @keyframes empilha{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
      .risca{stroke-dasharray:220;stroke-dashoffset:220;animation:risca 1.6s ease-out .5s forwards}
      @keyframes risca{to{stroke-dashoffset:0}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}.risca{stroke-dashoffset:0}}
    </style>
  </defs>

  <g font-family="Jost, Century Gothic, Futura, Segoe UI, Arial, sans-serif">

    <g class="card">
      <g filter="url(#pSombra)"><rect x="30" y="16" width="300" height="216" rx="28" fill="#fffdff" stroke="#7e22ce" stroke-opacity=".24" stroke-width="1.5"/></g>
      <rect x="56" y="42" width="42" height="42" rx="14" fill="#7e22ce" fill-opacity=".12"/>
      <g class="bate" style="transform-origin:77px 64px">
        <path d="M77 73 c-8.4 -5.6 -12.2 -10.2 -12.2 -14.9 a6 6 0 0 1 12.2 -2.9 a6 6 0 0 1 12.2 2.9 c0 4.7 -3.8 9.3 -12.2 14.9 z" fill="#7e22ce"/>
      </g>
      <text x="56" y="124" font-size="14.5" font-weight="700" letter-spacing="1.4" fill="#111827">UX HUMANIZADO</text>
      <rect x="56" y="134" width="36" height="3.5" rx="1.75" fill="#7e22ce"/>
      <g font-size="12" fill="#4b5563">
        <text x="56" y="164">Pesquisa e empatia antes do primeiro</text>
        <text x="56" y="182">pixel. Cada elemento na tela tem</text>
        <text x="56" y="200">uma justificativa por trás.</text>
      </g>
    </g>

    <g class="card k2">
      <g filter="url(#pSombra)"><rect x="350" y="16" width="300" height="216" rx="28" fill="#fffdff" stroke="#2563eb" stroke-opacity=".24" stroke-width="1.5"/></g>
      <rect x="376" y="42" width="42" height="42" rx="14" fill="#2563eb" fill-opacity=".12"/>
      <g fill="#2563eb">
        <rect class="sobebar" x="387" y="62" width="6" height="12" rx="2"/>
        <rect class="sobebar v2" x="396" y="56" width="6" height="18" rx="2"/>
        <rect class="sobebar v3" x="405" y="50" width="6" height="24" rx="2"/>
      </g>
      <path class="risca" d="M386 68 l9 -6 9 -7 8 -8" fill="none" stroke="#2563eb" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round"/>
      <text x="376" y="124" font-size="14.5" font-weight="700" letter-spacing="1.4" fill="#111827">PERFORMANCE QUE VENDE</text>
      <rect x="376" y="134" width="36" height="3.5" rx="1.75" fill="#2563eb"/>
      <g font-size="12" fill="#4b5563">
        <text x="376" y="164">Velocidade não é detalhe técnico:</text>
        <text x="376" y="182">é o que separa uma visita de</text>
        <text x="376" y="200">uma compra concluída.</text>
      </g>
    </g>

    <g class="card k3">
      <g filter="url(#pSombra)"><rect x="670" y="16" width="300" height="216" rx="28" fill="#fffdff" stroke="#db2777" stroke-opacity=".24" stroke-width="1.5"/></g>
      <rect x="696" y="42" width="42" height="42" rx="14" fill="#db2777" fill-opacity=".12"/>
      <g fill="none" stroke="#db2777" stroke-width="1.9" stroke-linejoin="round">
        <path class="empilha" d="M717 50 l11 6 -11 6 -11 -6 z"/>
        <path class="empilha e2" d="M706 62 l11 6 11 -6" stroke-opacity=".7"/>
        <path class="empilha e3" d="M706 70 l11 6 11 -6" stroke-opacity=".45"/>
      </g>
      <text x="696" y="124" font-size="14.5" font-weight="700" letter-spacing="1.4" fill="#111827">ARQUITETURA QUE ESCALA</text>
      <rect x="696" y="134" width="36" height="3.5" rx="1.75" fill="#db2777"/>
      <g font-size="12" fill="#4b5563">
        <text x="696" y="164">Componentes modulares e bem</text>
        <text x="696" y="182">documentados, para que a próxima</text>
        <text x="696" y="200">funcionalidade entre sem atrito.</text>
      </g>
    </g>

    <g class="card k4">
      <rect x="60" y="266" width="210" height="1.5" fill="url(#pRegua)"/>
      <rect x="730" y="266" width="210" height="1.5" fill="url(#pRegua2)"/>
      <text x="500" y="271" font-size="10.5" letter-spacing="2.4" text-anchor="middle" fill="#6b7280">CONSTRUÍMOS JUNTOS, COM FOCO EM RESULTADOS</text>
    </g>
  </g>
</svg>
