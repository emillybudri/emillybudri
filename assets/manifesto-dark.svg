<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" width="1000" height="356" role="img" aria-label="Manifesto: na Budri não criamos apenas design, criamos experiências. O mesmo arquivo vira wireframe e vira código."><defs><clipPath id="budri-componente"><rect width="1000" height="356"/></clipPath><style>
      .marca-move{animation:marca-move 15s ease-in-out infinite}
      .marca-pulse{animation:marca-pulse 4s ease-in-out infinite}
      @keyframes marca-move{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-8px)}}
      @keyframes marca-pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style></defs><g clip-path="url(#budri-componente)"><path class="marca-move" d="M-50 14 C130 -43 180 48 143 137 S222 304 467 356 H-50Z" fill="#39264d" opacity=".38"/><path d="M18 28V328" stroke="#a855f7" stroke-width="3"/><circle class="marca-move" cx="440" cy="46" r="17" fill="none" stroke="#a677e9" stroke-opacity=".5"/><g transform="translate(0 0)">
  <defs>
    <linearGradient id="mFundo" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#131017"/><stop offset="55%" stop-color="#0c0911"/><stop offset="100%" stop-color="#171020"/>
    </linearGradient>
    <radialGradient id="mB1" cx="50%" cy="50%"><stop offset="0%" stop-color="#b06cf0" stop-opacity=".22"/><stop offset="100%" stop-color="#b06cf0" stop-opacity="0"/></radialGradient>
    <radialGradient id="mB2" cx="50%" cy="50%"><stop offset="0%" stop-color="#a78bfa" stop-opacity=".16"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="mTitulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="mRegua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="mSombra" x="-20%" y="-20%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#c084fc" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mCard"><rect width="1000" height="356" rx="28"/></clipPath>
    <clipPath id="mPainel"><rect x="526" y="88" width="402" height="178" rx="12"/></clipPath>
    <style>
      .b1 { animation: fl1 8s ease-in-out infinite }
      .b2 { animation: fl2 10s ease-in-out infinite }
      @keyframes fl1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(5px,-12px)} }
      @keyframes fl2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-6px,-9px)} }
      .deriva { animation: deriva 26s ease-in-out infinite alternate }
      @keyframes deriva { from{transform:translate(0,0)} to{transform:translate(26px,-14px)} }

      .sobe { animation: sobe .9s cubic-bezier(.2,.7,.3,1) both }
      .sobe2{ animation: sobe .9s cubic-bezier(.2,.7,.3,1) .12s both }
      .sobe3{ animation: sobe .9s cubic-bezier(.2,.7,.3,1) .24s both }
      .sobe4{ animation: sobe .9s cubic-bezier(.2,.7,.3,1) .36s both }
      @keyframes sobe { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

      /* o painel alterna entre o arquivo de design e o arquivo de codigo */
      .telaA{ animation: ta 10s ease-in-out infinite }
      @keyframes ta { 0%,40%{opacity:1} 50%,92%{opacity:0} 100%{opacity:1} }
      .telaB{ animation: tb 10s ease-in-out infinite }
      @keyframes tb { 0%,40%{opacity:0} 50%,92%{opacity:1} 100%{opacity:0} }
      .abaA { animation: ta 10s ease-in-out infinite }
      .abaB { animation: tb 10s ease-in-out infinite }
      .pilula { animation: pilula 10s ease-in-out infinite }
      @keyframes pilula { 0%,40%{transform:translateX(0)} 50%,92%{transform:translateX(112px)} 100%{transform:translateX(0)} }

      .risca { stroke-dasharray:260; stroke-dashoffset:260; animation: risca 10s ease-out infinite }
      @keyframes risca { 0%{stroke-dashoffset:260} 16%,46%{stroke-dashoffset:0} 52%,100%{stroke-dashoffset:260} }
      .linha { transform-origin:566px 0; animation: linha 10s ease-out infinite }
      .l1{animation-delay:0s}.l2{animation-delay:.1s}.l3{animation-delay:.2s}
      .l4{animation-delay:.3s}.l5{animation-delay:.4s}.l6{animation-delay:.5s}
      @keyframes linha { 0%,50%{transform:scaleX(0)} 60%,92%{transform:scaleX(1)} 100%{transform:scaleX(0)} }
      .cur { animation: cur 1s steps(1) infinite }
      @keyframes cur { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .mao { animation: mao 10s ease-in-out infinite }
      @keyframes mao { 0%{transform:translate(0,0)} 12%{transform:translate(62px,30px)} 24%{transform:translate(130px,6px)} 38%{transform:translate(156px,64px)} 46%,100%{transform:translate(156px,64px);opacity:0} }

      @media (prefers-reduced-motion: reduce){
        *{animation:none !important}
        .telaB,.abaB,.mao{opacity:0}
        .risca{stroke-dashoffset:0}
      }
    </style>
  </defs>

  <g clip-path="url(#mCard)">

    <g class="deriva"></g>


    <g fill="none" stroke-width="3">
      <g class="b1" style="animation-delay:.4s" stroke="#c084fc" opacity=".6"><circle cx="470" cy="52" r="15"/><circle cx="470" cy="52" r="8" stroke-width="2"/></g>
      <g class="b2" style="animation-delay:1.1s" stroke="#faf8ff" opacity=".35"><circle cx="486" cy="292" r="11"/></g>
      <g class="b1" style="animation-delay:1.7s" stroke="#c084fc" opacity=".45"><circle cx="34" cy="150" r="9.5"/><circle cx="34" cy="150" r="4.2" fill="#c084fc" stroke="none"/></g>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
      <g class="sobe">
        <rect x="56" y="50" width="9" height="9" rx="2" fill="#a855f7"/>
        <text x="78" y="59" font-size="11.5" letter-spacing="4" fill="#a855f7">MANIFESTO</text>
      </g>
      <text class="sobe2" x="56" y="100" font-size="18" fill="#c4bdcf">Na Budri, não criamos apenas design.</text>
      <text class="sobe3" x="54" y="152" font-size="42" font-weight="700" letter-spacing="1.6" fill="#faf8ff">CRIAMOS</text>
      <text class="sobe3" x="54" y="200" font-size="42" font-weight="700" letter-spacing="1.6" fill="url(#mTitulo)">EXPERIÊNCIAS</text>
      <rect class="sobe4" x="56" y="220" width="96" height="5" rx="2.5" fill="url(#mRegua)"/>
      <g class="sobe4" font-size="13.5" fill="#c4bdcf">
        <text x="56" y="256">Design que resolve, código que sustenta.</text>
        <text x="56" y="278">A mesma pessoa que desenha a interface</text>
        <text x="56" y="300">escreve o código que a sustenta.</text>
      </g>
    </g>

    <!-- painel: o mesmo arquivo, dois idiomas -->
    <g class="sobe4">
      <g>
        <rect x="510" y="46" width="434" height="252" rx="20" fill="#131017" stroke="#39264d" stroke-width="1.5"/>
      </g>
      <circle cx="534" cy="70" r="4.5" fill="#a855f7"/><circle cx="550" cy="70" r="4.5" fill="#a855f7"/><circle cx="566" cy="70" r="4.5" fill="#c084fc"/>
      <rect class="pilula" x="600" y="59" width="106" height="22" rx="11" fill="#a855f7" fill-opacity=".12" stroke="#a855f7" stroke-opacity=".35"/>
      <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="10.5" text-anchor="middle">
        <text class="abaA" x="653" y="74" fill="#e9d5ff">design.fig</text>
        <text class="abaA" x="765" y="74" fill="#aaa0b7">index.tsx</text>
        <text class="abaB" x="653" y="74" fill="#aaa0b7">design.fig</text>
        <text class="abaB" x="765" y="74" fill="#e9d5ff">index.tsx</text>
      </g>
      <line x1="510" y1="88" x2="944" y2="88" stroke="#39264d" stroke-width="1.5"/>

      <g clip-path="url(#mPainel)">
        <!-- A · o arquivo de design -->
        <g class="telaA">
          <g fill="none" stroke-width="1.6">
            <rect class="risca" x="546" y="106" width="152" height="13" rx="6.5" stroke="#c084fc"/>
            <rect class="risca" x="546" y="130" width="204" height="8" rx="4" stroke="#c084fc" stroke-opacity=".4"/>
            <rect class="risca" x="546" y="146" width="168" height="8" rx="4" stroke="#c084fc" stroke-opacity=".4"/>
            <rect class="risca" x="546" y="170" width="88" height="28" rx="14" stroke="#a855f7"/>
            <rect class="risca" x="774" y="106" width="140" height="112" rx="14" stroke="#c084fc"/>
            <path class="risca" d="M788 196 l30 -34 22 24 20 -18 26 28" stroke="#c084fc" stroke-opacity=".55"/>
            <rect class="risca" x="546" y="222" width="368" height="34" rx="12" stroke="#c084fc" stroke-opacity=".26"/>
          </g>
          <circle cx="836" cy="140" r="10" fill="#a78bfa" fill-opacity=".45"/>
          <g class="mao"><path d="M584 138 l0 21 5 -6 5 11 5 -2 -5 -11 7 0 z" fill="#faf8ff"/></g>
        </g>

        <!-- B · o mesmo arquivo, em codigo -->
        <g class="telaB" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11.5">
          <g fill="#aaa0b7" font-size="9.5" opacity=".7">
            <text x="534" y="114">1</text><text x="534" y="136">2</text><text x="534" y="158">3</text>
            <text x="534" y="180">4</text><text x="534" y="202">5</text><text x="534" y="224">6</text>
          </g>
          <g class="linha l1"><text x="552" y="114"><tspan fill="#a855f7">export default</tspan> <tspan fill="#c084fc">function</tspan> <tspan fill="#e9d5ff">Budri</tspan><tspan fill="#c4bdcf">() {</tspan></text></g>
          <g class="linha l2"><text x="566" y="136"><tspan fill="#c084fc">const</tspan> <tspan fill="#faf8ff">experiencia</tspan> <tspan fill="#c4bdcf">=</tspan> <tspan fill="#c084fc">useEmpatia</tspan><tspan fill="#c4bdcf">()</tspan></text></g>
          <g class="linha l3"><text x="566" y="158" fill="#aaa0b7">// clareza &gt; complexidade</text></g>
          <g class="linha l4"><text x="566" y="180"><tspan fill="#a855f7">return</tspan> <tspan fill="#c4bdcf">(</tspan></text></g>
          <g class="linha l5"><text x="580" y="202"><tspan fill="#c084fc">&lt;Digital</tspan> <tspan fill="#c084fc">simples</tspan> <tspan fill="#c084fc">humano</tspan> <tspan fill="#c084fc">inesquecível</tspan> <tspan fill="#c084fc">/&gt;</tspan></text></g>
          <g class="linha l6"><text x="566" y="224" fill="#c4bdcf">) }</text></g>
          <rect class="cur" x="580" y="238" width="7" height="14" fill="#a855f7"/>
        </g>
      </g>

      <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="9.5" letter-spacing="1.6">
        <text x="532" y="284" fill="#aaa0b7">ESCUTA &#8594; DESENHA &#8594; CONSTRÓI &#8594; ENTREGA</text>
        <text x="922" y="284" text-anchor="end" fill="#a855f7">100% AUTORAL</text>
      </g>
    </g>


  </g>
</g></g></svg>
