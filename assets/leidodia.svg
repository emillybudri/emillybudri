<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 248" width="1000" height="248" role="img" aria-label="Lei de UX do dia 27.10.2026: EFEITO IKEA. A gente valoriza mais o que ajudou a construir. Personalizar o perfil, montar a lista, escolher o tema: cada gesto desses amarra a pessoa ao produto."><defs><clipPath id="budri-componente"><rect width="1000" height="248"/></clipPath><style>
      .marca-move{animation:marca-move 15s ease-in-out infinite}
      .marca-pulse{animation:marca-pulse 4s ease-in-out infinite}
      @keyframes marca-move{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,-8px)}}
      @keyframes marca-pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style></defs><g clip-path="url(#budri-componente)"><path d="M16 1H960L999 40V247H16Q1 247 1 232V16Q1 1 16 1Z" fill="#faf5ff" stroke="#e9d5ff"/><path d="M960 1V40H999" fill="#e9d5ff"/><path d="M18 20V228" stroke="#9333ea" stroke-width="4"/><g transform="translate(0 0)">
  <defs>
    <linearGradient id="lFundo" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#fffdff"/><stop offset="55%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <radialGradient id="lB1" cx="50%" cy="50%"><stop offset="0%" stop-color="#b06cf0" stop-opacity=".16"/><stop offset="100%" stop-color="#b06cf0" stop-opacity="0"/></radialGradient>
    <linearGradient id="lRegua" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9333ea"/><stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <clipPath id="lCard"><rect width="1000" height="248" rx="28"/></clipPath>
    <clipPath id="lQuadro"><rect x="600" y="32" width="360" height="166" rx="20"/></clipPath>
    <style>
      .sobe{animation:sobe .9s cubic-bezier(.2,.7,.3,1) both}
      .s2{animation-delay:.1s}.s3{animation-delay:.2s}.s4{animation-delay:.3s}
      @keyframes sobe{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .vivo{animation:vivo 2.4s ease-in-out infinite}
      @keyframes vivo{0%,100%{opacity:1}50%{opacity:.25}}
      .pulso{animation:pulso 3s ease-in-out infinite}
      @keyframes pulso{0%{opacity:.7}70%,100%{opacity:0}}
      .seta{animation:seta 4s ease-in-out infinite}
      @keyframes seta{0%,100%{transform:translate(0,0)}45%,55%{transform:translate(74px,-64px)}}
      .barra{transform-origin:24px 0;animation:cresce 1.2s cubic-bezier(.2,.7,.3,1) .4s both}
      .b2{transform-origin:214px 0;animation-delay:.55s}
      .enche{transform-origin:28px 0;animation:cresce 1.4s cubic-bezier(.2,.7,.3,1) .4s both}
      @keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .curva{stroke-dasharray:420;stroke-dashoffset:420;animation:curva 2s ease-out .4s forwards}
      @keyframes curva{to{stroke-dashoffset:0}}
      .cur{animation:cur 1s steps(1) infinite}
      @keyframes cur{0%,49%{opacity:1}50%,100%{opacity:0}}
      .bate{animation:bate 2.6s ease-in-out infinite}
      @keyframes bate{0%,100%{transform:scale(1)}30%{transform:scale(1.12)}45%{transform:scale(1)}60%{transform:scale(1.06)}}
      .destaca{animation:destaca 3.4s ease-in-out infinite}
      @keyframes destaca{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
      @media (prefers-reduced-motion: reduce){
        *{animation:none !important}
        .curva{stroke-dashoffset:0} .pulso{opacity:.4}
      }
    </style>
  </defs>

  <g clip-path="url(#lCard)">



    <g font-family="Segoe UI, Arial, sans-serif">
      <g class="sobe">
        <circle class="vivo" cx="45" cy="44" r="4.5" fill="#7e22ce"/>
        <text x="59" y="48" font-size="10.5" letter-spacing="3" fill="#7e22ce">LEI DE UX DO DIA &#183; 27.10.2026</text>
      </g>
      <text class="sobe s2" x="38" y="104" font-size="30" font-weight="700" letter-spacing="1.2" fill="#111015">EFEITO IKEA</text>
      <rect class="sobe s3" x="40" y="118" width="80" height="4" rx="2" fill="url(#lRegua)"/>
      <g class="sobe s3"><text x="40" y="146" font-size="12.5" fill="#57515f">A gente valoriza mais o que ajudou a construir.</text><text x="40" y="167" font-size="12.5" fill="#57515f">Personalizar o perfil, montar a lista, escolher o tema:</text><text x="40" y="188" font-size="12.5" fill="#57515f">cada gesto desses amarra a pessoa ao produto.</text></g>
      <text class="sobe s4" x="40" y="216" font-size="9" letter-spacing="1.4" fill="#716979" font-family="SFMono-Regular, Consolas, Menlo, monospace">ATUALIZADA AUTOMATICAMENTE TODA MADRUGADA &#183; UMA LEI DIFERENTE POR DIA</text>

      <g class="sobe s4">
        <rect x="600" y="32" width="360" height="166" rx="20" fill="#fffdff" stroke="#e9d5ff" stroke-width="1.6"/>
        <g clip-path="url(#lQuadro)"><g transform="translate(600,32)">
  <rect x="46" y="44" width="116" height="12" rx="6.0" fill="#7e22ce" fill-opacity="1"/><rect x="46" y="66" width="116" height="12" rx="6.0" fill="#7e22ce" fill-opacity="1"/><rect x="46" y="88" width="116" height="12" rx="6.0" fill="#7e22ce" fill-opacity="1"/>
  <g class="seta"><path d="M174 60 l0 22 5.5 -6.5 5.5 12 5 -2.4 -5.5 -12 7.5 0 z" fill="#7e22ce"/></g>
  <rect x="216" y="44" width="120" height="70" rx="14" fill="#7e22ce" fill-opacity=".14" stroke="#7e22ce" stroke-width="1.6"/>
  <text x="276" y="86" font-size="11" text-anchor="middle" fill="#7e22ce">O SEU PERFIL</text>
  <text x="180" y="146" font-size="9" letter-spacing="1.4" text-anchor="middle" fill="#57515f">O QUE A PESSOA AJUDA A MONTAR ELA PASSA A DEFENDER</text>
</g></g>
      </g>
    </g>


  </g>
</g></g></svg>
